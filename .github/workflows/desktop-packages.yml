name: Cross-platform desktop QA (internal only)
on:
  workflow_dispatch:
    inputs:
      create_installers:
        description: "Also build unsigned OS-native installer inside runner (never upload binaries)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Internal QA on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 21 with jpackage
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Python for cross-OS packaging script
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Compile, unit test and build game JAR
        shell: bash
        run: mvn -B -ntp clean verify
      - name: Audit version, Java media and packaging logic
        shell: bash
        run: |
          python -m unittest discover -s tools -p 'test_*.py' -v
          python tools/dependency_inventory.py --pom pom.xml
          python tools/release_gate.py --mode development --jar target/airraid-0.9.2.jar
      - name: Build native app image and smoke bundled JVM
        shell: bash
        env:
          MAKE_INSTALLERS: ${{ inputs.create_installers }}
        run: |
          args=()
          if [ "$MAKE_INSTALLERS" = "true" ]; then
            args+=(--installer)
          fi
          python tools/package_desktop.py --mode development --output target/desktop-qa "${args[@]}"
      - name: Upload evidence only (never signed/unsigned binaries)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airraid-v092-${{ matrix.platform }}-internal-evidence
          path: |
            target/desktop-evidence-*.json
            target/release-readiness.json
            target/dependency-inventory.json
          if-no-files-found: error
          retention-days: 7
