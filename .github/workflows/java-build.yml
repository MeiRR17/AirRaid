name: Java build
on:
  pull_request:
    branches: [master]
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/java-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn -B -ntp --no-transfer-progress clean verify
      - name: Check packaged JAR
        run: |
          test -f target/airraid-0.9.4.jar
          jar tf target/airraid-0.9.4.jar | grep -F 'Resource/General/background.png'
          jar tf target/airraid-0.9.4.jar | grep -F 'Main.class'
          java -jar target/airraid-0.9.4.jar --version | grep -F 'AirRaid 0.9.4 / INTERNAL BETA'
      - name: Asset provenance and dependency inventory (development mode)
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          python3 tools/dependency_inventory.py --pom pom.xml --output target/dependency-inventory.json
          python3 tools/release_gate.py --mode development --jar target/airraid-0.9.4.jar --output target/release-readiness.json
          python3 tools/beta_gate.py --mode development --output target/beta-readiness.json
      - name: Build and smoke Linux app image with bundled Java 21
        run: |
          python3 tools/package_desktop.py --mode development --output target/desktop-qa
          test -f target/desktop-evidence-linux.json
          grep -F '"java_runtime_bundled": true' target/desktop-evidence-linux.json
          grep -F '"public_distribution_allowed": false' target/desktop-evidence-linux.json
          test -d target/desktop-qa/images/AirRaid
      - name: GUI launch smoke under virtual display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a timeout 20s java -cp target/classes:target/test-classes GuiSmoke
      - name: Publish actual game screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airraid-v094-gui-captures
          path: |
            target/airraid-v094-ci-settings.png
            target/airraid-v094-ci-gameplay.png
            target/airraid-v094-ci-compact-hud.png
            target/airraid-v094-ci-paused.png
            target/airraid-v094-ci-results.png
            target/airraid-v094-ci-checklist.png
            target/release-readiness.json
            target/dependency-inventory.json
            target/desktop-evidence-linux.json
            target/beta-readiness.json
          if-no-files-found: error
          retention-days: 7
